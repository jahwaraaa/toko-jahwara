services:
  - type: web
    name: toko-jahwara
    runtime: python
    plan: free
    rootDir: toko-jarkom
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: toko
      - key: DATABASE_URL
        sync: false